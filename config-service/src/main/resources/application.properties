spring.application.name=config-service
server.port=9999

# Profil "native" actif par defaut pour un demarrage local immediat avec ./config-repo
# Pour utiliser le depot GitHub distant, activez le profil "git" (-Dspring.profiles.active=git)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo,file:../config-repo

# Configuration GitHub (profil "git")
spring.cloud.config.server.git.uri=https://github.com/mohamedYoussfi/micro-services-app
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=*

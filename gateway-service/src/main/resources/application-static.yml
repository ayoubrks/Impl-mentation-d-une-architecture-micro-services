# Configuration statique des routes (profil "static")
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: customer-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/customers/**
        - id: inventory-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: billing-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/bills/**,/fullBill/**
